<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Reverse - Code Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<!-- toast 容器 —— body 直下，不受任何父级影响，永远在导航栏下方 -->
<div id="toastContainer" style="position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;"></div>

<div class="container py-4" style="max-width: 780px;">
    <h3 class="mb-4">DB Reverse Engineering</h3>

    <!-- Step 1: Connection -->
    <div class="card mb-4">
        <div class="card-header fw-bold">Step 1: 连接数据库</div>
        <div class="card-body">
            <div class="row align-items-end mb-3">
                <div class="col-md-5">
                    <label class="form-label">已保存的连接</label>
                    <select class="form-select" id="savedConnSelect">
                        <option value="">-- 手动填写 --</option>
                    </select>
                </div>
                <div class="col-md-7 d-flex gap-1 align-items-end" style="padding-bottom: 1px;">
                    <button type="button" class="btn btn-sm btn-outline-success" onclick="loadSavedConnection()">加载</button>
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="saveCurrentConnection()">保存当前</button>
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteSavedConnection()">删除</button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">数据库类型</label>
                <select class="form-select" id="dbType">
                    <option value="mysql" selected>MySQL</option>
                    <option value="postgresql">PostgreSQL</option>
                    <option value="oracle">Oracle</option>
                    <option value="sqlserver">SQL Server</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">JDBC URL</label>
                <input type="text" class="form-control" id="jdbcUrl"
                       placeholder="jdbc:mysql://localhost:3306/dbname?useSSL=false&serverTimezone=UTC" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" placeholder="root" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" placeholder="password">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Schema (可选, PostgreSQL/Oracle 等需要)</label>
                <input type="text" class="form-control" id="schemaPattern" placeholder="public">
            </div>
            <button type="button" class="btn btn-outline-primary" id="testConnBtn" onclick="testConnection()">
                <span id="testConnText">测试连接</span>
                <span id="testConnSpinner" class="spinner-border spinner-border-sm d-none"></span>
            </button>
        </div>
    </div>

    <!-- Step 2: Select Tables (hidden initially) -->
    <div class="card mb-4 d-none" id="step2Card">
        <div class="card-header fw-bold">Step 2: 选择表并生成</div>
        <div class="card-body">
            <p class="text-success" id="connSuccessMsg"></p>
            <div class="mb-2">
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="selectAll(true)">全选</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="selectAll(false)">取消全选</button>
            </div>
            <div class="table-list border rounded p-3 mb-3" id="tableList" style="max-height: 300px; overflow-y: auto;">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Package Name</label>
                    <input type="text" class="form-control" id="reversePackageName" placeholder="com.example.demo" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Author</label>
                    <input type="text" class="form-control" id="author" placeholder="developer">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Module Name (可选)</label>
                    <input type="text" class="form-control" id="moduleName" placeholder="sys">
                </div>
            </div>
            <button type="button" class="btn btn-primary px-4" id="genBtn" onclick="generateReverse()">
                <span id="genBtnText">生成并下载</span>
                <span id="genBtnSpinner" class="spinner-border spinner-border-sm d-none"></span>
            </button>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- 内嵌 showAlert 兜底：即使 app.js 加载失败，错误提示也能正常显示 -->
<script>
window._toastTimer = null;
window.showAlert = function(message, type) {
    var box = document.getElementById('toastContainer');
    if (!box) {
        box = document.createElement('div');
        box.id = 'toastContainer';
        box.style.cssText = 'position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;';
        document.body.appendChild(box);
    }
    if (window._toastTimer) { clearTimeout(window._toastTimer); window._toastTimer = null; }
    box.innerHTML = '';
    if (!message) return;
    box.innerHTML = '<div class="alert alert-' + type + '" role="alert" style="pointer-events:auto;margin:0;box-shadow:0 4px 16px rgba(0,0,0,0.25);max-width:520px;font-size:15px;text-align:center;">' +
        message +
        '<button type="button" class="btn-close ms-2" onclick="var p=this.parentNode;if(p)p.remove();" aria-label="Close"></button>' +
        '</div>';
    window._toastTimer = setTimeout(function() { box.innerHTML = ''; window._toastTimer = null; }, 4000);
};
</script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
