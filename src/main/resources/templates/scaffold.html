<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Scaffold - Code Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div id="toastContainer" style="position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;"></div>

<div class="container py-4" style="max-width: 680px;">
    <h3 class="mb-4">Project Scaffold Generator</h3>

    <form id="scaffoldForm">
        <div class="mb-3">
            <label class="form-label">Group ID</label>
            <input type="text" class="form-control" id="groupId" placeholder="com.example" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Artifact ID</label>
            <input type="text" class="form-control" id="artifactId" placeholder="demo" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Package Name</label>
            <input type="text" class="form-control" id="packageName" placeholder="com.example.demo">
        </div>
        <div class="mb-3">
            <label class="form-label">Project Name</label>
            <input type="text" class="form-control" id="projectName" placeholder="demo">
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Spring Boot Version</label>
                <select class="form-select" id="springBootVersion">
                    <option value="3.2.0" selected>3.2.0</option>
                    <option value="3.3.0">3.3.0</option>
                    <option value="3.1.0">3.1.0</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Java Version</label>
                <select class="form-select" id="javaVersion">
                    <option value="17" selected>17</option>
                    <option value="21">21</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Server Port</label>
                <input type="number" class="form-control" id="port" value="8080">
            </div>
        </div>
        <button type="submit" class="btn btn-primary px-4" id="generateBtn">
            <span id="btnText">生成并下载</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
        </button>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
window._toastTimer = null;
window.showAlert = function(message, type) {
    var box = document.getElementById('toastContainer');
    if (!box) {
        box = document.createElement('div');
        box.id = 'toastContainer';
        box.style.cssText = 'position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;';
        document.body.appendChild(box);
    }
    if (window._toastTimer) { clearTimeout(window._toastTimer); window._toastTimer = null; }
    box.innerHTML = '';
    if (!message) return;
    box.innerHTML = '<div class="alert alert-' + type + '" role="alert" style="pointer-events:auto;margin:0;box-shadow:0 4px 16px rgba(0,0,0,0.25);max-width:520px;font-size:15px;text-align:center;">' +
        message +
        '<button type="button" class="btn-close ms-2" onclick="var p=this.parentNode;if(p)p.remove();" aria-label="Close"></button>' +
        '</div>';
    window._toastTimer = setTimeout(function() { box.innerHTML = ''; window._toastTimer = null; }, 4000);
};
</script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
